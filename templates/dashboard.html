<script>
function addProduct() {
    var selector = document.getElementById('product-selector');
    var value = selector.value;
    if (value === 'd3') {
        document.getElementById('card-d3').style.display = 'block';
        document.getElementById('active-d3').value = '1';
    } else if (value === 'magnesium') {
        document.getElementById('card-magnesium').style.display = 'block';
        document.getElementById('active-magnesium').value = '1';
    }
    selector.value = '';
}

function removeProduct(type) {
    if (type === 'd3') {
        document.getElementById('card-d3').style.display = 'none';
        document.getElementById('active-d3').value = '0';
    } else if (type === 'magnesium') {
        document.getElementById('card-magnesium').style.display = 'none';
        document.getElementById('active-magnesium').value = '0';
    }
}

document.querySelector('form').addEventListener('submit', function(e) {
    var d3 = document.getElementById('active-d3').value;
    var mg = document.getElementById('active-magnesium').value;
    if (d3 === '0' && mg === '0') {
        e.preventDefault();
        alert('Παρακαλώ προσθέστε τουλάχιστον ένα σκεύασμα!');
    }
});
</script>
